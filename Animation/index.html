<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="heart-container">
        <h1>I Love You 💖</h1>
        <p>Will you be mine forever?</p>

        <!-- Yes Button -->
        <button id="yesBtn">Yes, of course I love you!</button>

        <!-- No Button -->
        <button id="noBtn">No</button>

        <!-- Phone Number Input (Hidden Initially) -->
        <div id="phoneInputSection" style="display: none;">
            <input type="tel" id="phoneInput" placeholder="Enter your phone number" />
            <button id="submitPhoneBtn">Submit</button>
            <button id="noPhoneBtn">I don’t want to give it</button>
        </div>

        <!-- Message Container for "No" Response -->
        <div id="noMessage" style="display: none;">
            <p>You broke my heart 💔</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
