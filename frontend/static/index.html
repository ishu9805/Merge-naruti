<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Network</title>
    <style>
        /* Global styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body, html {
            height: 100%;
        }

        /* Background image for both the homepage and search page */
        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }

        /* Hero section for homepage */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Search bar style */
        .search-bar {
            width: 300px;
            padding: 10px;
            font-size: 18px;
            border: 1px solid white;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.5);
            color: black;
        }

        /* Grid layout for results page */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
            padding: 20px;
        }

        /* Individual grid item */
        .grid img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .grid img:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Modal for displaying image details */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            width: 100%;
        }

        .modal img {
            width: 100%;
            height: auto;
        }

        .modal .details {
            margin-top: 10px;
            color: #333;
            font-size: 16px;
        }

        /* Button to close modal */
        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Home page with background and search bar -->
    <div class="hero">
        <form id="searchForm" action="search.html" method="GET">
            <input type="text" name="query" class="search-bar" placeholder="Search for characters...">
        </form>
    </div>

    <!-- This section only appears on the search results page -->
    <div class="grid">
        <!-- Placeholder images for grid (use your own images) -->
        <img src="image1.jpg" alt="Character 1">
        <img src="image2.jpg" alt="Character 2">
        <img src="image3.jpg" alt="Character 3">
        <img src="image4.jpg" alt="Character 4">
        <img src="image5.jpg" alt="Character 5">
        <img src="image6.jpg" alt="Character 6">
        <img src="image7.jpg" alt="Character 7">
        <!-- Add more images as needed -->
    </div>

    <!-- Modal for displaying large image -->
    <div class="modal" id="imageModal">
        <button class="close-modal" onclick="closeModal()">Close</button>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="details" id="modalDetails">Image details here</div>
        </div>
    </div>

    <script>
        // Function to open modal when clicking an image
        document.querySelectorAll('.grid img').forEach(img => {
            img.addEventListener('click', () => {
                const modal = document.getElementById('imageModal');
                const modalImage = document.getElementById('modalImage');
                const modalDetails = document.getElementById('modalDetails');
                
                modal.style.display = 'flex'; // Show modal
                modalImage.src = img.src; // Set the image in modal
                modalDetails.textContent = img.alt; // Show image alt text as details
            });
        });

        // Function to close modal
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }

        // Hide the grid on the home page
        window.onload = function() {
            const grid = document.querySelector('.grid');
            if (window.location.pathname === '/index.html' || window.location.pathname === '/') {
                grid.style.display = 'none'; // Hide grid on home page
            }
        };
    </script>
</body>
</html>
