<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Network</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Hero Section Styling */
        .hero {
            background-image: url('background.jpg'); /* Replace with your background image */
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        /* Blade Network Title */
        .hero h1 {
            font-size: 4rem;
            margin: 0;
            padding: 0;
        }

        /* Search Bar Styling */
        .search-bar {
            margin-top: 20px;
            padding: 10px;
            width: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            font-size: 20px;
            outline: none;
        }

        /* Other content on homepage (e.g., headers, footers) */
        .content {
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            color: #333;
        }

        /* Grid Layout */
        .grid {
            display: none; /* Initially hidden */
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            padding: 20px;
            margin-top: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .grid img {
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .grid img:hover {
            transform: scale(1.05);
        }

        /* Modal for Image Details */
        .modal {
            display: none; /* Hidden initially */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .modal img {
            max-width: 100%;
            height: auto;
        }

        .details {
            margin-top: 10px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Blade Network</h1> <!-- Title for the homepage -->
        <input type="text" class="search-bar" placeholder="Search for characters...">
    </div>

    <!-- Other content below the hero section -->
    <div class="content">
        <p>Welcome to Blade Network, your ultimate character hub.</p>
        <p>Explore amazing characters by searching above.</p>
    </div>

    <!-- Grid Layout for Search Results -->
    <div class="grid">
        <img src="image1.jpg" alt="Image 1">
        <img src="image2.jpg" alt="Image 2">
        <img src="image3.jpg" alt="Image 3">
        <!-- Add more images for the search results -->
    </div>

    <!-- Modal for Image Details -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="details" id="modalDetails">Image Details</div>
        </div>
    </div>

    <script>
        const searchBar = document.querySelector('.search-bar');
        const grid = document.querySelector('.grid');
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalDetails = document.getElementById('modalDetails');

        // Show the grid when the user types in the search bar
        searchBar.addEventListener('input', () => {
            if (searchBar.value.trim() !== '') {
                grid.style.display = 'grid'; // Show grid on search
            } else {
                grid.style.display = 'none'; // Hide grid when input is empty
            }
        });

        // Handle image click for modal
        document.querySelectorAll('.grid img').forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'flex';
                modalImage.src = img.src;
                modalDetails.textContent = img.alt;
            });
        });

        // Close the modal when clicking outside the image
        modal.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>

</body>
</html>
