<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Network</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://files.catbox.moe/9jbemn.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
        }
        header img {
            height: 50px;
        }
        header h1 {
            font-size: 24px;
            margin: 0;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-right: 20px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .content-section {
            padding: 20px;
        }
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .character-item {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 150px;
            height: auto;
        }
        .character-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-bottom: 1px solid #ddd;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .character-item h3 {
            margin: 10px 0 5px;
            font-size: 1.0em;
        }
        .character-item p {
            margin: 5px 0;
            font-size: 0.9em;
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination button {
            margin: 0 5px;
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background-color: #ccc;
        }
        /* Search Section */
        #search-section, #user-section {
            display: none;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            margin: 20px auto;
            max-width: 800px;
            border-radius: 8px;
        }
        #search-section h2, #user-section h2 {
            margin-bottom: 20px;
        }
        #multi-search-form input {
            margin-right: 10px;
            padding: 10px;
            width: calc(25% - 20px);
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        #multi-search-form button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Modal (Popup) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.5s;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            position: relative;
        }
        .modal-content img {
            width: 100%;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <img src="https://files.catbox.moe/078cs5.jpg" alt="Blade Network">
        <h1>Blade Network</h1>
        <nav>
            <ul>
                <li><a href="javascript:void(0)" onclick="showSection('home')">Home</a></li>
                <li><a href="javascript:void(0)" onclick="showSection('search-section')">Search Collection</a></li>
                <li><a href="javascript:void(0)" onclick="showSection('user-section')">Search User</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-section">
        <!-- Home Section: Default view showing a collection grid -->
        <section id="home">
            <h2>Featured Collection</h2>
            <div class="character-grid" id="home-collection">
                <!-- Dynamic content: Insert collection items here -->
            </div>
        </section>

        <!-- Search Section -->
        <section id="search-section">
            <h2>Search Characters</h2>
            <form id="multi-search-form">
                <input type="text" id="name-query" placeholder="name">
                <input type="text" id="anime-query" placeholder="anime">
                <input type="text" id="rarity-query" placeholder="rarity">
                <input type="text" id="id-query" placeholder="ID">
                <button type="submit">Search</button>
            </form>
            <div id="search-results" class="character-grid"></div>
            <div class="pagination">
                <button id="prev-page" disabled>Previous</button>
                <button id="next-page">Next</button>
            </div>
        </section>

        <!-- User Search Section -->
        <section id="user-section">
            <h2>Search User by ID</h2>
            <form id="user-search-form">
                <input type="text" id="user-id-query" placeholder="Enter user ID">
                <button type="submit">Search User</button>
            </form>
            <div id="user-collection" class="character-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Blade Network</p>
    </footer>

    <!-- Popup Modal -->
    <div id="image-popup" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="popup-image" src="" alt="Popup Image">
        </div>
    </div>

    <script>
        // JavaScript to switch between sections
        function showSection(sectionId) {
            document.getElementById('home').style.display = 'none';
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('user-section').style.display = 'none';

            document.getElementById(sectionId).style.display = 'block';
        }

        // Event listener for search form
        document.getElementById('multi-search-form').addEventListener('submit', function(event) {
            event.preventDefault();
            // Add AJAX or fetch request here to get search results by filters
        });

        // Event listener for user search form
        document.getElementById('user-search-form').addEventListener('submit', function(event) {
            event.preventDefault();
            // Add AJAX or fetch request here to search user by ID and display their collection
        });
    </script>
</body>
</html>
