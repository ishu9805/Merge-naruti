<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Website</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        .hero {
            background-image: url('background.jpg'); /* Set your background image */
            height: 100vh;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search-bar {
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            font-size: 20px;
            outline: none;
        }
        .grid {
            display: none; /* Initially hide the grid */
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            padding: 20px;
            animation: fadeIn 1s;
        }
        .grid img {
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .grid img:hover {
            transform: scale(1.05);
        }
        .modal {
            display: none; /* Initially hidden */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            position: relative;
            background-color: white;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .modal img {
            max-width: 100%;
            height: auto;
        }
        .details {
            margin-top: 10px;
            font-size: 16px;
            color: #333;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero">
        <input type="text" class="search-bar" placeholder="Search images...">
    </div>

    <!-- Grid Layout -->
    <div class="grid">
        <img src="image1.jpg" alt="Image 1">
        <img src="image2.jpg" alt="Image 2">
        <img src="image3.jpg" alt="Image 3">
        <!-- Add more images here, up to 7 in a row -->
    </div>

    <!-- Modal for image details -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="details" id="modalDetails">Image Details</div>
        </div>
    </div>

    <script>
        const searchBar = document.querySelector('.search-bar');
        const grid = document.querySelector('.grid');
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalDetails = document.getElementById('modalDetails');

        // Show grid when user searches
        searchBar.addEventListener('input', () => {
            grid.style.display = 'grid';
        });

        // Handle image click
        document.querySelectorAll('.grid img').forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'flex';
                modalImage.src = img.src;
                modalDetails.textContent = img.alt; // Example details based on image alt text
            });
        });

        // Close modal when clicking outside of the image
        modal.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>

</body>
</html>
