<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blade Network</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="siteLoader" class="site-loader">
    <div class="loader-orb"></div>
    <p>Loading cosmic gallery...</p>
</div>

<header class="top-bar">
    <h1>Blade Network</h1>
    <p class="subtitle">Discover premium anime visuals in a sleek, immersive showcase built for collectors.</p>
</header>

<section class="search-bar">
    <input type="text" id="searchName" placeholder="🔍 Name">
    <input type="text" id="searchAnime" placeholder="🎬 Anime">
    <input type="text" id="userIdInput" placeholder="👤 Telegram user id (for user collection)">

    <div class="rarity-select">
        <button id="rarityBtn">🎖 All</button>
        <div class="rarity-dropdown" id="rarityDropdown"></div>
    </div>

    <div class="source-buttons">
        <button id="botSearchBtn" onclick="searchFromBotCollection()">Search Bot Collection</button>
        <button id="userSearchBtn" onclick="searchFromUserCollection()">Search User Collection</button>
    </div>
    <button onclick="clearSearch()" class="clear-btn">Clear</button>
</section>

<section class="profile-card" id="profileCard">
    <h2>Profile</h2>
    <p id="profileMeta">Load user collection to view profile details.</p>
</section>

<main>
    <section class="media-grid" id="mediaGrid"></section>
</main>

<script src="/js/scripts.js"></script>
</body>
</html>
