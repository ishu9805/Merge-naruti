<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Network</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://files.catbox.moe/9jbemn.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
        }
        header img {
            height: 50px;
        }
        header h1 {
            font-size: 24px;
            margin: 0;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-right: 20px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
        }
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .character-item {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 180px;
            height: auto;
        }
        .character-item img {
            width: 100px; /* Adjust width */
            height: 100px; /* Adjust height */
            object-fit: cover; /* Maintain aspect ratio */
            border-bottom: 1px solid #ddd;
            margin-bottom: 10px;
            loading: lazy; /* Lazy load images */
            cursor: pointer; /* Change cursor to pointer */
        }
        .character-item h3 {
            margin: 10px 0 5px;
            font-size: 1.2em;
        }
        .character-item p {
            margin: 5px 0;
            font-size: 0.9em;
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination button {
            margin: 0 5px;
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background-color: #ccc;
        }

        /* Modal (Popup) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.8); /* Black with opacity */
            animation: fadeIn 0.5s; /* Animation for showing */
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
            max-width: 600px;
            position: relative;
        }

        .modal-content img {
            width: 100%; /* Responsive image */
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <img src="https://files.catbox.moe/078cs5.jpg" alt="Blade Network">
        <h1>Blade Network</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="#search">Search</a></li>
            </ul>
        </nav>
    </header>
    <main>        
        <section id="search">
            <h2>Search Characters</h2>
            <form id="multi-search-form">
                <input type="text" id="name-query" placeholder="Search by name">
                <input type="text" id="anime-query" placeholder="Search by anime">
                <input type="text" id="rarity-query" placeholder="Search by rarity">
                <input type="text" id="id-query" placeholder="Search by ID">
                <button type="submit">Search</button>
            </form>
            <div id="applied-filters"></div>
            <div id="search-results" class="character-grid"></div>
            <div class="pagination">
                <button id="prev-page" disabled>Previous</button>
                <button id="next-page">Next</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Blade Network</p>
    </footer>
    
    <!-- Popup Modal -->
    <div id="image-popup" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="popup-image" src="" alt="Popup Image">
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
