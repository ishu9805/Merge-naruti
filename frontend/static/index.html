<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Collection</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .character-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .character-item {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .character-item img {
            max-width: 100%;
            height: auto;
            border-bottom: 1px solid #ddd;
            margin-bottom: 10px;
        }
        .character-item h3 {
            margin: 10px 0 5px;
            font-size: 1.2em;
        }
        .character-item p {
            margin: 5px 0;
            font-size: 0.9em;
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination button {
            margin: 0 5px;
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Character Collection</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="#search">Search</a></li>
                <li><a href="#user-collection">User Collection</a></li>
                <li><a href="#collection">Collection</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>Explore the world of characters and anime!</p>
        </section>
        <section id="search">
            <h2>Search Characters</h2>
            <form id="search-form">
                <input type="text" id="search-query" placeholder="Search by name or anime...">
                <button type="submit">Search</button>
            </form>
            <div id="search-results" class="character-grid"></div>
        </section>
        <section id="user-collection">
            <h2>Your Collection</h2>
            <div id="user-collection-data"></div>
        </section>
        <section id="collection">
            <h2>Character Collection</h2>
            <div id="collection-results" class="character-grid"></div>
            <div class="pagination">
                <button id="prev-page" disabled>Previous</button>
                <button id="next-page">Next</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Character Collection</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
