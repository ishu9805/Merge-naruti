server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or IP address

    # Location block to proxy requests to Flask app
    location / {
        proxy_pass http://127.0.0.1:5000;  # Flask app running on localhost:5000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optionally, serve static files directly from NGINX
    location /static/ {
        alias /path/to/your/repo/frontend/static/;
    }
}
